---
# Ansible inventory for dotfiles bootstrap.
#
# Hosts belong to two orthogonal group axes:
#   purpose: personal / work
#   OS:      macos / linux
# Each host joins one group per axis (e.g. laptop24 ∈ {personal, macos}).
#
# All hosts run Ansible against localhost.
# Use --limit <hostname> to target a specific machine, or --limit <group> to
# target everything in (say) the linux group.

all:
  children:
    personal:
      hosts:
        laptop24:
          ansible_connection: local
          ansible_host: localhost
        mini18:
          ansible_connection: local
          ansible_host: localhost
        mini26:
          ansible_connection: local
          ansible_host: localhost
        devbox:
          ansible_connection: local
          ansible_host: localhost
    work:
      hosts: {}
    macos:
      hosts:
        laptop24:
        mini18:
        mini26:
    linux:
      hosts:
        devbox:
