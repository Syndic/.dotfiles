---
# Ansible inventory for dotfiles bootstrap.
#
# Groups are organized as orthogonal "group sets". Each host joins exactly one
# group per set. Currently defined sets:
#
#   purpose:  personal | work
#   os:       macos    | linux
#
# Per-group values for a set live in `group_vars/<group>.yml` under variable
# names of the form `group_<set>_<thing>` (see group_vars/all.yml for the full
# convention). The list of active sets is declared as `group_sets` in
# group_vars/all.yml; roles iterate that list via a per-set `set_fact` loop
# using `lookup('vars', 'group_<set>_<thing>')`. Adding a new set is a
# one-line edit there (plus the per-group_vars files for the new groups),
# with no per-role edits.
#
# Adding a new set (e.g. `env: prod | staging`) requires:
#   (1) listing the groups in this file with their hosts (one group per host
#       within the new set);
#   (2) adding `group_<newset>_<thing>` vars to each new group's
#       group_vars/<group>.yml, covering every layered var a role running on
#       hosts in that group might consume (see existing group_vars/macos.yml
#       or linux.yml for the shape — `lookup('vars', name)` raises on a
#       missing name, which is what catches typos in `group_sets` or
#       in any role's `<thing>` reference);
#   (3) adding the new set's name to `group_sets` in group_vars/all.yml.
#
# No role changes needed at step (3) — the indirection picks the new set up
# automatically.
#
# OS-axis role gating still uses runtime `ansible_facts['system']` /
# `ansible_facts['os_family']` (see site.yml), not the `os` group set. The
# group set is for layered _values_ (which Brewfile, which macOS defaults
# list, which apt packages...); the role-gating facts decide _whether the
# role runs at all_. The two could collapse into one if we wanted, but
# keeping them separate means a misconfigured inventory (host put in the
# wrong os group) doesn't accidentally run the wrong roles — only loads the
# wrong layered values.
#
# All hosts run Ansible against localhost. The playbook is invoked against
# exactly one host at a time via `--limit <hostname>`.

all:
  children:
    personal:
      hosts:
        laptop24:
          ansible_connection: local
          ansible_host: localhost
        mini18:
          ansible_connection: local
          ansible_host: localhost
        mini26:
          ansible_connection: local
          ansible_host: localhost
        devbox:
          ansible_connection: local
          ansible_host: localhost
    work:
      hosts: {}
    macos:
      hosts:
        laptop24:
        mini18:
        mini26:
    linux:
      hosts:
        devbox:
