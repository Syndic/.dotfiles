---
# End-to-end Linux tests.
# Manually-triggered only (workflow_dispatch). Each job is a thin wrapper
# around a script under tests/ — same code path runs locally and in CI.
#
# Why manual: each run includes a real Linuxbrew install and full playbook,
# which takes several minutes. The round-trip job additionally re-runs
# install and a full --all teardown, roughly doubling the runtime. Wire to
# push/pull_request later if/when the cost is acceptable.

name: e2e-linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run end-to-end Linux test (install only)
        run: ./tests/e2e-linux.sh

  e2e-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run end-to-end Linux test (install ↔ uninstall round-trip)
        run: ./tests/e2e-roundtrip-linux.sh
