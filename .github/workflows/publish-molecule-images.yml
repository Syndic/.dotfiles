---
# Build + push the prebuilt molecule base images to ghcr. Who pulls them, the
# per-Dockerfile tag, the monthly rebuild, and the public-visibility
# requirement: CLAUDE.md "Homebrew molecule scenarios".

name: publish-molecule-images

on:
  push:
    branches: [main]
    paths:
      - 'roles/homebrew/molecule/Dockerfile'
      - 'roles/homebrew/molecule/image-tag.sh'
      - '.github/workflows/publish-molecule-images.yml'
  schedule:
    - cron: '0 8 1 * *'   # 1st of the month, 08:00 UTC — bounds image staleness
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghcr image paths must be lowercase. github.repository_owner returns
      # the casing of the GitHub org/user, which may be mixed-case — compute
      # a lowercased copy here rather than hardcoding the owner.
      - id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-tag
        run: echo "value=$(roles/homebrew/molecule/image-tag.sh)" >> "$GITHUB_OUTPUT"

      # The image-tag value is what tests/run pulls; `sha-<short>` pins a
      # regression to the publishing commit (via MOLECULE_HOMEBREW_IMAGE).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/dotfiles-homebrew-molecule
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.value }}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: roles/homebrew/molecule/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
