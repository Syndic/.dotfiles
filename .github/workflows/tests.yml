---
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Frozen at the macOS CLT version phase2.py runs under. See the
          # "Python 3.9 pin" section in CLAUDE.md for the rationale.
          python-version: '3.9'
      - run: pip install pytest
      - run: pytest tests/python -v

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/bash

  lint:
    # yamllint + ansible-lint. Both need Python >= 3.10 (ansible-lint hard
    # requirement), so this job runs on the same latest-Python pin as the
    # molecule job rather than the frozen 3.9. ansible-lint resolves
    # imports at parse time, so the Galaxy collections in requirements.yml
    # must be installed first — same as the devcontainer's post-create.sh
    # does for local lint runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # renovate: datasource=python-version depName=python
          python-version: '3.14'
      - run: pip install yamllint ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint

  molecule:
    # Per-role molecule scenarios, sharded across roles via the matrix. The
    # previous serial single job was wall-clock-bound by whatever the slowest
    # role happened to be (today: homebrew, which builds a Linuxbrew base
    # image inline); sharding lets the lighter roles return in parallel while
    # homebrew runs in its own cell. Local devs still get the serial path
    # via `./tests/run molecule` (no role arg).
    #
    # `fail-fast: false` so a failure in one role doesn't cancel sibling
    # shards — we want every failing role surfaced in one CI run, not a
    # whack-a-mole sequence.
    #
    # New molecule-covered roles must be added here AND to MOLECULE_ROLES in
    # tests/run (local serial and CI shard discovery read different sources).
    strategy:
      fail-fast: false
      matrix:
        role: [dotfiles, apt, flatpak, homebrew]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Match the devcontainer's tooling-Python pin (`tooling_python` in
          # .devcontainer/post-create.sh) so CI and local dev exercise the
          # same interpreter. Renovate keeps this in step via the customManager
          # in renovate.json.
          # renovate: datasource=python-version depName=python
          python-version: '3.14'
      # Installing the full `ansible` package (not bare ansible-core) brings its
      # ~100 bundled collections — community.docker + ansible.posix among them —
      # into the same environment molecule runs in. docker + requests are the
      # Python libs community.docker's container modules import; they're not
      # pulled in by molecule itself.
      - run: pip install ansible molecule 'molecule-plugins[docker]' docker requests
      # Explicitly install molecule's docker-driver collections. Normally a
      # no-op (the line above already bundles them), but stating the dependency
      # keeps the molecule job working if a future `ansible` release trims its
      # bundle. Mirrors .devcontainer/post-create.sh.
      - run: ansible-galaxy collection install community.docker ansible.posix
      - run: ./tests/run molecule ${{ matrix.role }}

  molecule-all:
    # Aggregator: collapses the `molecule (<role>)` shards into one stable
    # check so branch protection can require a single name. Without this,
    # adding a new role means adding a new required-check entry; with it,
    # the required check stays `molecule-all` regardless of how many shards
    # exist.
    #
    # `if: always()` so the aggregator runs even when shards fail or get
    # skipped — otherwise the check would itself be marked "skipped" on
    # shard failure, which some branch-protection configurations treat as
    # not-required.
    #
    # `needs.molecule.result` is the matrix-level rollup: 'success' iff
    # every shard succeeded, otherwise 'failure'/'cancelled'.
    if: always()
    needs: molecule
    runs-on: ubuntu-latest
    steps:
      - name: Assert every molecule shard passed
        run: |
          result='${{ needs.molecule.result }}'
          if [[ "$result" != "success" ]]; then
            echo "molecule matrix rollup: ${result}" >&2
            exit 1
          fi
