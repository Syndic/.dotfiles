name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Frozen at the macOS CLT version phase2.py runs under. See the
          # "Python 3.9 pin" section in CLAUDE.md for the rationale.
          python-version: '3.9'
      - run: pip install pytest
      - run: pytest tests/python -v

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/bash

  molecule:
    # Per-role molecule scenarios (roles/{dotfiles,apt,flatpak}/molecule/default).
    # Faster than the e2e-linux harness so it's safe to gate every PR on;
    # the heavy install↔uninstall round-trip stays manual via workflow_dispatch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Match the devcontainer's latest-Python pin (`additionalVersions`
          # in .devcontainer/devcontainer.json) so CI and local dev exercise
          # the same interpreter. Renovate keeps this in step via the
          # customManager in renovate.json.
          # renovate: datasource=python-version depName=python
          python-version: '3.14'
      # docker + requests are runtime deps for community.docker (the modules
      # molecule's docker driver uses to create/destroy containers). They're
      # not pulled in by molecule itself.
      - run: pip install ansible molecule 'molecule-plugins[docker]' docker requests
      # The Galaxy collections aren't bundled with ansible-core/molecule;
      # install explicitly so the docker driver's playbooks resolve their
      # modules.
      - run: ansible-galaxy collection install community.docker ansible.posix community.general
      - run: ./tests/run molecule
