---
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Frozen at the macOS CLT version phase2.py runs under. See the
          # "Python 3.9 pin" section in CLAUDE.md for the rationale.
          python-version: '3.9'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv as the devcontainer; see CLAUDE.md "Python 3.9 pin".
          # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
          version: '0.13.6'
          enable-cache: false
      - run: uv pip install --system -r test-requirements.txt
      - run: pytest -v

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/bash

  lint:
    # yamllint + ansible-lint. Both need Python >= 3.10 (ansible-lint hard
    # requirement), so this job runs on the same latest-Python pin as the
    # molecule job rather than the frozen 3.9. ansible-lint resolves
    # imports at parse time, so the Galaxy collections in requirements.yml
    # must be installed first — same as the devcontainer's post-create.sh
    # does for local lint runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # renovate: datasource=python-version depName=python
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv as the devcontainer; see CLAUDE.md "Python 3.9 pin".
          # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
          version: '0.13.6'
          enable-cache: false
      - run: uv pip install --system -r lint-requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint

  molecule:
    # One shard per role; tests/run runs each role's scenarios concurrently.
    # See CLAUDE.md "Tests" for the sharding and the molecule-all aggregator.
    #
    # `fail-fast: false` so a failure in one role doesn't cancel sibling
    # shards — we want every failing role surfaced in one CI run.
    #
    # New molecule-covered roles must be added here AND to MOLECULE_ROLES in
    # tests/run (test_molecule_role_lists_agree.py enforces it).
    strategy:
      fail-fast: false
      matrix:
        role: [dotfiles, apt, flatpak, homebrew, claude_code]
    runs-on: ubuntu-latest
    # packages: read so the homebrew shard can pull the prebuilt base image
    # from ghcr (see .github/workflows/publish-molecule-images.yml). The
    # published package is set to public so this works on fork PRs too
    # (where GITHUB_TOKEN is anonymous); the permission is here for the
    # case where the package is or becomes private.
    permissions:
      contents: read
      packages: read
    env:
      # Pull the prebuilt Linuxbrew base image instead of rebuilding it; only
      # the homebrew shard reads it. Lowercase because ghcr requires it.
      MOLECULE_HOMEBREW_IMAGE_REPO: ghcr.io/syndic/dotfiles-homebrew-molecule
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Match the devcontainer's tooling-Python pin (`tooling_python` in
          # .devcontainer/post-create.sh) so CI and local dev exercise the
          # same interpreter. Renovate keeps this in step via the customManager
          # in renovate.json.
          # renovate: datasource=python-version depName=python
          python-version: '3.14'
      # Backgrounded so the image pulls overlap the installs below.
      - run: ./tests/run pull ${{ matrix.role }} > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv as the devcontainer; see CLAUDE.md "Python 3.9 pin".
          # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
          version: '0.13.6'
          enable-cache: false
      - run: uv pip install --system -r molecule-requirements.txt
      # Every collection is version-pinned, so the requirements files' hash
      # fully determines the cache contents; a hit skips Galaxy entirely.
      - id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml', 'requirements-dev.yml') }}
      # Scenarios converge the real roles, so the runtime collections are
      # needed here too. Mirrors .devcontainer/post-create.sh.
      - if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r requirements-dev.yml
      - run: ./tests/run molecule ${{ matrix.role }}

  molecule-all:
    # Aggregator: collapses the `molecule (<role>)` shards into one stable
    # check so branch protection can require a single name. Without this,
    # adding a new role means adding a new required-check entry; with it,
    # the required check stays `molecule-all` regardless of how many shards
    # exist.
    #
    # `if: always()` so the aggregator runs even when shards fail or get
    # skipped — otherwise the check would itself be marked "skipped" on
    # shard failure, which some branch-protection configurations treat as
    # not-required.
    #
    # `needs.molecule.result` is the matrix-level rollup: 'success' iff
    # every shard succeeded, otherwise 'failure'/'cancelled'.
    if: always()
    needs: molecule
    runs-on: ubuntu-latest
    steps:
      - name: Assert every molecule shard passed
        run: |
          result='${{ needs.molecule.result }}'
          if [[ "$result" != "success" ]]; then
            echo "molecule matrix rollup: ${result}" >&2
            exit 1
          fi
