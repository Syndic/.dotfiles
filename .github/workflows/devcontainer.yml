name: Devcontainer

# Build the devcontainer and smoke-test the toolchain it ships. Catches breakage from
# Renovate-driven bumps to the Debian base, the `features` block (python/git/etc.), or
# the apt `bats` install in the Dockerfile before someone hits it locally.
# The workflow always runs so the status check always reports — a trigger-level `paths:`
# filter would skip the workflow entirely on unrelated PRs, leaving a required check
# permanently pending. Path filtering happens inside the job instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build devcontainer and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history back to the PR base / previous push so we can diff for changed paths.
          fetch-depth: 0

      - id: changes
        name: Detect devcontainer changes
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # tee so the decision is visible in the run log; $GITHUB_OUTPUT alone is invisible.
          # Zero SHA = branch-creation push with no prior commit to diff against; treat as changed.
          if [[ "$base" =~ ^0+$ ]]; then
            echo "changed=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base...HEAD" \
              | grep -Eq '^\.devcontainer/|^\.github/workflows/devcontainer\.yml$'; then
            echo "changed=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "changed=false" | tee -a "$GITHUB_OUTPUT"
          fi

      # devcontainers/ci builds with the full feature set (so feature bumps are exercised,
      # not just the Dockerfile) and runs the smoke command inside the resulting container.
      # `push: never` keeps this self-contained — no registry or credentials needed.
      - if: steps.changes.outputs.changed == 'true'
        uses: devcontainers/ci@b63b30de439b47a52267f241112c5b453b673db5 # v0.3
        with:
          push: never
          # Asserts the default interpreter is still the pinned 3.9.x (a Renovate
          # bump of the frozen pin would fail here). `bats` confirms the Dockerfile
          # apt install; `pytest`/`pre-commit` confirm post-create.sh ran. `ansible`
          # /`ansible-lint` confirm the pipx install onto the latest-Python
          # additionalVersion landed (their `--version` output names that Python).
          runCmd: |
            set -euo pipefail
            python3 --version
            python3 --version | grep -q '^Python 3\.9\.'
            bats --version
            pytest --version
            pre-commit --version
            ansible --version
            ansible-lint --version

      - if: steps.changes.outputs.changed != 'true'
        run: echo "No devcontainer changes in this PR; skipping build."
