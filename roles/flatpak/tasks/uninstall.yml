---
# flatpak role — uninstall path. Inverse of main.yml.
# Removes the layered apps but leaves the Flathub remote and flatpak itself
# in place; those are easy to remove by hand and may be wanted by non-dotfile
# installs.

# Init guarantees flatpak_group_layer is defined even when group_sets
# is empty (the resolve loop below runs zero times in that case).
# Mirrors the install side; see roles/flatpak/tasks/main.yml.
- name: Initialize flatpak_group_layer
  ansible.builtin.set_fact:
    flatpak_group_layer: []

- name: Resolve flatpak group-set layers
  ansible.builtin.set_fact:
    flatpak_group_layer: >-
      {{ flatpak_group_layer + lookup('vars', 'group_' ~ item ~ '_flatpak') }}
  loop: "{{ group_sets }}"
  loop_control:
    label: "group_{{ item }}_flatpak"

- name: Remove flatpak apps (common + group-set layers + host)
  become: true
  community.general.flatpak:
    name: >-
      {{ (common_flatpak | default([]))
         + flatpak_group_layer
         + (host_flatpak | default([])) }}
    state: absent
    method: system
