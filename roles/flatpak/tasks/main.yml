---
# flatpak role (Linux)
# 1) Install flatpak itself.
# 2) Register the Flathub remote (system-wide).
# 3) Install GUI apps from the layered list vars
#    common_flatpak + (group_<set>_flatpak for set in group_sets) + host_flatpak.
# See group_vars/all.yml for the package-layering convention (including
# the `lookup('vars', ...)`-based indirection over `group_sets`).
# The role itself is OS-gated to ansible_system == 'Linux' in site.yml.

- name: Ensure flatpak is installed
  become: true
  ansible.builtin.package:
    name: flatpak
    state: present

- name: Configure the Flathub remote (system-wide)
  become: true
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: system

- name: Resolve flatpak group-set layers
  ansible.builtin.set_fact:
    flatpak_group_layer: >-
      {{ (flatpak_group_layer | default([]))
         + lookup('vars', 'group_' ~ item ~ '_flatpak') }}
  loop: "{{ group_sets }}"
  loop_control:
    label: "group_{{ item }}_flatpak"

- name: Install flatpak apps (common + group-set layers + host)
  become: true
  community.general.flatpak:
    name: >-
      {{ (common_flatpak | default([]))
         + flatpak_group_layer
         + (host_flatpak | default([])) }}
    state: present
    remote: flathub
    method: system
