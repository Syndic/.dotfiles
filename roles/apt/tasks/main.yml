---
# apt role (Debian/Ubuntu)
# Install packages from the layered list vars
#   common_apt + (group_<set>_apt for set in group_sets) + host_apt
# defined in group_vars/all.yml, group_vars/<group>.yml, and
# host_vars/<host>.yml respectively. See group_vars/all.yml for the
# package-layering convention (including the `lookup('vars', ...)`-based
# indirection over `group_sets`). The role itself is OS-gated to
# ansible_os_family == 'Debian' in site.yml, so it's safe to expect
# apt here.

- name: Resolve apt group-set layers
  # `lookup('vars', name)` without a default raises on a missing name,
  # so a typo in `group_sets` or a group_vars file that doesn't declare
  # its `group_<set>_apt` layer fails loudly here rather than silently
  # contributing nothing.
  ansible.builtin.set_fact:
    apt_group_layer: >-
      {{ (apt_group_layer | default([]))
         + lookup('vars', 'group_' ~ item ~ '_apt') }}
  loop: "{{ group_sets }}"
  loop_control:
    label: "group_{{ item }}_apt"

- name: Install apt packages (common + group-set layers + host)
  become: true
  ansible.builtin.apt:
    name: >-
      {{ (common_apt | default([]))
         + apt_group_layer
         + (host_apt | default([])) }}
    state: present
    update_cache: true
    cache_valid_time: 3600
