---
# dotfiles role
# Merge home_source/common with home_source/hosts/<inventory_hostname>,
# then symlink the effective tree into dotfiles_home_dir.

- name: Check whether the common dotfiles source tree exists
  ansible.builtin.stat:
    path: "{{ dotfiles_common_source_dir }}"
  register: dotfiles_common_source_dir_state

- name: Check whether the host dotfiles source tree exists
  ansible.builtin.stat:
    path: "{{ dotfiles_host_source_dir }}"
  register: dotfiles_host_source_dir_state

- name: Skip dotfiles role when no source tree is present
  ansible.builtin.debug:
    msg: >-
      no dotfiles source tree found at {{ dotfiles_common_source_dir }} or
      {{ dotfiles_host_source_dir }}; skipping
  when:
    - not (dotfiles_common_source_dir_state.stat.isdir | default(false))
    - not (dotfiles_host_source_dir_state.stat.isdir | default(false))

- name: Manage dotfiles symlinks
  when:
    - (dotfiles_common_source_dir_state.stat.isdir | default(false)) or
      (dotfiles_host_source_dir_state.stat.isdir | default(false))
  block:
    - name: Compute effective dotfiles manifest
      ansible.builtin.command:
        argv:
          - python3
          - "{{ dotfiles_manager_script }}"
          - build-manifest
          - --common-dir
          - "{{ dotfiles_common_source_dir }}"
          - --host-dir
          - "{{ dotfiles_host_source_dir }}"
          - --managed-root
          - "{{ dotfiles_managed_root_dir }}"
          - --home-dir
          - "{{ dotfiles_home_dir }}"
          - --excludes-json
          - "{{ dotfiles_excludes | to_json }}"
      register: dotfiles_manifest_command
      changed_when: false

    - name: Parse effective dotfiles manifest JSON
      ansible.builtin.set_fact:
        dotfiles_target_directories: "{{ (dotfiles_manifest_command.stdout | from_json).directories }}"
        dotfiles_target_links: "{{ (dotfiles_manifest_command.stdout | from_json).links }}"
        dotfiles_stale_managed_links: "{{ (dotfiles_manifest_command.stdout | from_json).stale_links }}"

    - name: Remove stale managed symlinks
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ dotfiles_stale_managed_links | default([]) }}"

    - name: Inspect destination directory paths
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ dotfiles_target_directories | default([]) }}"
      register: dotfiles_target_directory_stats

    - name: Collect conflicting destination directories
      ansible.builtin.set_fact:
        dotfiles_conflicting_directory_targets: >-
          {{
            (dotfiles_conflicting_directory_targets | default([])) + [{
              'dest': directory_target_stat.item.dest
            }]
          }}
      loop: "{{ dotfiles_target_directory_stats.results | default([]) }}"
      loop_control:
        loop_var: directory_target_stat
      when:
        - (directory_target_stat.stat.exists | default(false)) or (directory_target_stat.stat.islnk | default(false))
        - not (directory_target_stat.stat.isdir | default(false))

    - name: Back up conflicting destination directories
      ansible.builtin.include_tasks: backup_destination.yml
      vars:
        backup_kind: directory
        targets: "{{ dotfiles_conflicting_directory_targets | default([]) }}"

    - name: Ensure destination directories exist
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: directory
        mode: "0755"
      loop: "{{ dotfiles_target_directories | default([]) }}"

    - name: Inspect destination symlink paths
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ dotfiles_target_links | default([]) }}"
      register: dotfiles_target_link_stats

    - name: Collect managed symlinks that need retargeting
      ansible.builtin.set_fact:
        dotfiles_links_to_retarget: >-
          {{
            (dotfiles_links_to_retarget | default([])) + [{
              'dest': link_target_stat.item.dest
            }]
          }}
      loop: "{{ dotfiles_target_link_stats.results | default([]) }}"
      loop_control:
        loop_var: link_target_stat
      when:
        - link_target_stat.stat.islnk | default(false)
        - >
          ((link_target_stat.stat.lnk_source | default('')) == link_target_stat.item.managed_root) or
          ((link_target_stat.stat.lnk_source | default('')).startswith(link_target_stat.item.managed_root ~ '/'))
        - (link_target_stat.stat.lnk_target | default('')) != link_target_stat.item.src

    - name: Remove managed symlinks before retargeting
      ansible.builtin.file:
        path: "{{ link_to_retarget.dest }}"
        state: absent
      loop: "{{ dotfiles_links_to_retarget | default([]) }}"
      loop_control:
        loop_var: link_to_retarget

    - name: Collect conflicting destination files
      ansible.builtin.set_fact:
        dotfiles_conflicting_file_targets: >-
          {{
            (dotfiles_conflicting_file_targets | default([])) + [{
              'dest': link_target_stat.item.dest
            }]
          }}
      loop: "{{ dotfiles_target_link_stats.results | default([]) }}"
      loop_control:
        loop_var: link_target_stat
      when:
        - (link_target_stat.stat.exists | default(false)) or (link_target_stat.stat.islnk | default(false))
        - not (
            (link_target_stat.stat.islnk | default(false)) and
            (link_target_stat.stat.lnk_target | default('')) == link_target_stat.item.src
          )
        - not (
            (link_target_stat.stat.islnk | default(false)) and
            (
              ((link_target_stat.stat.lnk_source | default('')) == link_target_stat.item.managed_root) or
              ((link_target_stat.stat.lnk_source | default('')).startswith(link_target_stat.item.managed_root ~ '/'))
            )
          )

    - name: Back up conflicting destination files
      ansible.builtin.include_tasks: backup_destination.yml
      vars:
        backup_kind: file
        targets: "{{ dotfiles_conflicting_file_targets | default([]) }}"

    - name: Create destination dotfiles symlinks
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: false
      loop: "{{ dotfiles_target_links | default([]) }}"
