---
# dotfiles role
# Merge home_source/common with home_source/hosts/<inventory_hostname>,
# then symlink the effective tree into dotfiles_home_dir.

- name: Check whether the common dotfiles source tree exists
  ansible.builtin.stat:
    path: "{{ dotfiles_common_source_dir }}"
  register: dotfiles_common_source_dir_state

- name: Check whether the host dotfiles source tree exists
  ansible.builtin.stat:
    path: "{{ dotfiles_host_source_dir }}"
  register: dotfiles_host_source_dir_state

- name: Skip dotfiles role when no source tree is present
  ansible.builtin.debug:
    msg: >-
      no dotfiles source tree found at {{ dotfiles_common_source_dir }} or
      {{ dotfiles_host_source_dir }}; skipping
  when:
    - not (dotfiles_common_source_dir_state.stat.isdir | default(false))
    - not (dotfiles_host_source_dir_state.stat.isdir | default(false))

- name: Manage dotfiles symlinks
  when:
    - (dotfiles_common_source_dir_state.stat.isdir | default(false)) or
      (dotfiles_host_source_dir_state.stat.isdir | default(false))
  block:
    - name: Build the effective dotfiles manifest
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/dotfiles_tree.py"
          - build-manifest
          - --common-dir
          - "{{ dotfiles_common_source_dir }}"
          - --host-dir
          - "{{ dotfiles_host_source_dir }}"
          - --managed-root
          - "{{ dotfiles_managed_root_dir }}"
          - --home-dir
          - "{{ dotfiles_home_dir }}"
          - --excludes-json
          - "{{ dotfiles_excludes | to_json }}"
      register: dotfiles_manifest_command
      changed_when: false

    - name: Parse the effective dotfiles manifest
      ansible.builtin.set_fact:
        dotfiles_target_directories: "{{ (dotfiles_manifest_command.stdout | from_json).directories }}"
        dotfiles_target_links: "{{ (dotfiles_manifest_command.stdout | from_json).links }}"
        dotfiles_stale_managed_links: "{{ (dotfiles_manifest_command.stdout | from_json).stale_links }}"

    - name: Remove stale managed symlinks that are no longer desired
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ dotfiles_stale_managed_links | default([]) }}"

    - name: Inspect target directory paths
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ dotfiles_target_directories | default([]) }}"
      register: dotfiles_target_directory_stats

    - name: Determine backup paths for conflicting target directories
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/dotfiles_tree.py"
          - backup-info
          - "{{ item.item.dest }}"
      loop: "{{ dotfiles_target_directory_stats.results | default([]) }}"
      when:
        - (item.stat.exists | default(false)) or (item.stat.islnk | default(false))
        - not (item.stat.isdir | default(false))
      register: dotfiles_target_directory_backups
      changed_when: false

    - name: Warn when repeated directory backups are required
      ansible.builtin.debug:
        msg: >-
          WARNING: backing up {{ item.item.item.dest }} to
          {{ (item.stdout | from_json).path }}. This is backup number
          {{ (item.stdout | from_json).index }}, which suggests a previously
          created backup was left in place and the managed path was changed again.
      loop: "{{ dotfiles_target_directory_backups.results | default([]) }}"
      when:
        - not (item.skipped | default(false))
        - (item.stdout | from_json).index > 1

    - name: Backup conflicting target directories
      ansible.builtin.command:
        argv:
          - mv
          - "{{ item.item.item.dest }}"
          - "{{ (item.stdout | from_json).path }}"
      loop: "{{ dotfiles_target_directory_backups.results | default([]) }}"
      when: not (item.skipped | default(false))

    - name: Ensure target directories exist
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: directory
      loop: "{{ dotfiles_target_directories | default([]) }}"

    - name: Inspect target symlink paths
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ dotfiles_target_links | default([]) }}"
      register: dotfiles_target_link_stats

    - name: Remove managed symlinks that need to be retargeted
      ansible.builtin.file:
        path: "{{ item.item.dest }}"
        state: absent
      loop: "{{ dotfiles_target_link_stats.results | default([]) }}"
      when:
        - item.stat.islnk | default(false)
        - >
          ((item.stat.lnk_source | default('')) == item.item.managed_root) or
          ((item.stat.lnk_source | default('')).startswith(item.item.managed_root ~ '/'))
        - (item.stat.lnk_target | default('')) != item.item.src

    - name: Determine backup paths for conflicting target files
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/dotfiles_tree.py"
          - backup-info
          - "{{ item.item.dest }}"
      loop: "{{ dotfiles_target_link_stats.results | default([]) }}"
      when:
        - (item.stat.exists | default(false)) or (item.stat.islnk | default(false))
        - not (
            (item.stat.islnk | default(false)) and
            (item.stat.lnk_target | default('')) == item.item.src
          )
        - not (
            (item.stat.islnk | default(false)) and
            (
              ((item.stat.lnk_source | default('')) == item.item.managed_root) or
              ((item.stat.lnk_source | default('')).startswith(item.item.managed_root ~ '/'))
            )
          )
      register: dotfiles_target_link_backups
      changed_when: false

    - name: Warn when repeated file backups are required
      ansible.builtin.debug:
        msg: >-
          WARNING: backing up {{ item.item.item.dest }} to
          {{ (item.stdout | from_json).path }}. This is backup number
          {{ (item.stdout | from_json).index }}, which suggests a previously
          created backup was left in place and the managed path was changed again.
      loop: "{{ dotfiles_target_link_backups.results | default([]) }}"
      when:
        - not (item.skipped | default(false))
        - (item.stdout | from_json).index > 1

    - name: Backup conflicting target files
      ansible.builtin.command:
        argv:
          - mv
          - "{{ item.item.item.dest }}"
          - "{{ (item.stdout | from_json).path }}"
      loop: "{{ dotfiles_target_link_backups.results | default([]) }}"
      when: not (item.skipped | default(false))

    - name: Create dotfiles symlinks
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: false
      loop: "{{ dotfiles_target_links | default([]) }}"
