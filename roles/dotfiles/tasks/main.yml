---
# dotfiles role
# Merge home_source/common with home_source/hosts/<inventory_hostname>,
# then symlink the effective tree into dotfiles_home_dir.

- name: Check whether the common dotfiles source tree exists
  ansible.builtin.stat:
    path: "{{ dotfiles_common_source_dir }}"
  register: dotfiles_common_source_dir_state

- name: Check whether the host dotfiles source tree exists
  ansible.builtin.stat:
    path: "{{ dotfiles_host_source_dir }}"
  register: dotfiles_host_source_dir_state

- name: Skip dotfiles role when no source tree is present
  ansible.builtin.debug:
    msg: >-
      no dotfiles source tree found at {{ dotfiles_common_source_dir }} or
      {{ dotfiles_host_source_dir }}; skipping
  when:
    - not (dotfiles_common_source_dir_state.stat.isdir | default(false))
    - not (dotfiles_host_source_dir_state.stat.isdir | default(false))

- name: Manage dotfiles symlinks
  when:
    - (dotfiles_common_source_dir_state.stat.isdir | default(false)) or
      (dotfiles_host_source_dir_state.stat.isdir | default(false))
  block:
    - name: Compute effective dotfiles manifest
      ansible.builtin.command:
        argv:
          - python3
          - "{{ dotfiles_manager_script }}"
          - build-manifest
          - --common-dir
          - "{{ dotfiles_common_source_dir }}"
          - --host-dir
          - "{{ dotfiles_host_source_dir }}"
          - --managed-root
          - "{{ dotfiles_managed_root_dir }}"
          - --home-dir
          - "{{ dotfiles_home_dir }}"
          - --excludes-json
          - "{{ dotfiles_excludes | to_json }}"
      register: dotfiles_manifest_command
      changed_when: false

    - name: Parse effective dotfiles manifest JSON
      ansible.builtin.set_fact:
        dotfiles_directory_slots: "{{ (dotfiles_manifest_command.stdout | from_json).directory_slots }}"
        dotfiles_link_slots: "{{ (dotfiles_manifest_command.stdout | from_json).link_slots }}"
        dotfiles_stale_links: "{{ (dotfiles_manifest_command.stdout | from_json).stale_links }}"

    - name: Remove stale managed symlinks
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ dotfiles_stale_links | default([]) }}"

    - name: Stat directory slots
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ dotfiles_directory_slots | default([]) }}"
      register: dotfiles_directory_slot_stats

    - name: Find directory slot blockers
      ansible.builtin.set_fact:
        dotfiles_directory_slot_blockers: >-
          {{
            (dotfiles_directory_slot_blockers | default([])) + [{
              'dest': directory_slot_stat.item.dest
            }]
          }}
      loop: "{{ dotfiles_directory_slot_stats.results | default([]) }}"
      loop_control:
        loop_var: directory_slot_stat
      when:
        - (directory_slot_stat.stat.exists | default(false)) or (directory_slot_stat.stat.islnk | default(false))
        - not (directory_slot_stat.stat.isdir | default(false))

    - name: Back up directory slot blockers
      ansible.builtin.include_tasks: backup_destination.yml
      vars:
        slot_kind: directory
        blockers: "{{ dotfiles_directory_slot_blockers | default([]) }}"

    - name: Populate directory slots
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: directory
        mode: "0755"
      loop: "{{ dotfiles_directory_slots | default([]) }}"

    - name: Stat link slots
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ dotfiles_link_slots | default([]) }}"
      register: dotfiles_link_slot_stats

    - name: Find managed symlinks needing retarget
      ansible.builtin.set_fact:
        dotfiles_managed_symlinks_to_retarget: >-
          {{
            (dotfiles_managed_symlinks_to_retarget | default([])) + [{
              'dest': link_slot_stat.item.dest
            }]
          }}
      loop: "{{ dotfiles_link_slot_stats.results | default([]) }}"
      loop_control:
        loop_var: link_slot_stat
      when:
        - link_slot_stat.stat.islnk | default(false)
        - >
          ((link_slot_stat.stat.lnk_source | default('')) == link_slot_stat.item.managed_root) or
          ((link_slot_stat.stat.lnk_source | default('')).startswith(link_slot_stat.item.managed_root ~ '/'))
        - (link_slot_stat.stat.lnk_target | default('')) != link_slot_stat.item.src

    - name: Remove managed symlinks before retargeting
      ansible.builtin.file:
        path: "{{ managed_symlink_to_retarget.dest }}"
        state: absent
      loop: "{{ dotfiles_managed_symlinks_to_retarget | default([]) }}"
      loop_control:
        loop_var: managed_symlink_to_retarget

    - name: Find link slot blockers
      ansible.builtin.set_fact:
        dotfiles_link_slot_blockers: >-
          {{
            (dotfiles_link_slot_blockers | default([])) + [{
              'dest': link_slot_stat.item.dest
            }]
          }}
      loop: "{{ dotfiles_link_slot_stats.results | default([]) }}"
      loop_control:
        loop_var: link_slot_stat
      when:
        - (link_slot_stat.stat.exists | default(false)) or (link_slot_stat.stat.islnk | default(false))
        - not (
            (link_slot_stat.stat.islnk | default(false)) and
            (link_slot_stat.stat.lnk_target | default('')) == link_slot_stat.item.src
          )
        - not (
            (link_slot_stat.stat.islnk | default(false)) and
            (
              ((link_slot_stat.stat.lnk_source | default('')) == link_slot_stat.item.managed_root) or
              ((link_slot_stat.stat.lnk_source | default('')).startswith(link_slot_stat.item.managed_root ~ '/'))
            )
          )

    - name: Back up link slot blockers
      ansible.builtin.include_tasks: backup_destination.yml
      vars:
        slot_kind: link
        blockers: "{{ dotfiles_link_slot_blockers | default([]) }}"

    - name: Populate link slots
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: false
      loop: "{{ dotfiles_link_slots | default([]) }}"
