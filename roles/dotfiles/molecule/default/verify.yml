---
- name: Verify — dotfiles role
  hosts: all
  gather_facts: false
  vars:
    # Must match converge.yml: where the fixture was staged inside the container.
    _container_fixture_root: /opt/dotfiles-molecule/home_source
    _test_home: /root/testhome
  tasks:
    - name: Stat the managed .testrc destination
      ansible.builtin.stat:
        path: "{{ _test_home }}/.testrc"
        follow: false
      register: dotfiles_testrc_stat

    - name: .testrc must be a symlink pointing at the staged fixture
      ansible.builtin.assert:
        that:
          - dotfiles_testrc_stat.stat.exists
          - dotfiles_testrc_stat.stat.islnk
          - dotfiles_testrc_stat.stat.lnk_target == _container_fixture_root ~ '/common/.testrc'
        fail_msg: ".testrc was not symlinked to the staged fixture (stat: {{ dotfiles_testrc_stat.stat }})"

    - name: Pre-existing .testrc must have been backed up to .backup-1
      ansible.builtin.stat:
        path: "{{ _test_home }}/.testrc.backup-1"
        follow: false
      register: dotfiles_testrc_backup_stat

    - name: Assert backup exists and is a regular file
      ansible.builtin.assert:
        that:
          - dotfiles_testrc_backup_stat.stat.exists
          - dotfiles_testrc_backup_stat.stat.isreg
        fail_msg: ".testrc.backup-1 missing or not a regular file"

    - name: Read backup file content
      ansible.builtin.slurp:
        src: "{{ _test_home }}/.testrc.backup-1"
      register: dotfiles_testrc_backup_content

    - name: Backup content must match the original pre-existing content
      ansible.builtin.assert:
        that:
          - (dotfiles_testrc_backup_content.content | b64decode) == "preexisting user content\n"

    - name: Stat the nested managed file's symlink
      ansible.builtin.stat:
        path: "{{ _test_home }}/.config/test/conf.toml"
        follow: false
      register: dotfiles_nested_stat

    - name: Nested file must be a symlink pointing at the staged fixture
      ansible.builtin.assert:
        that:
          - dotfiles_nested_stat.stat.exists
          - dotfiles_nested_stat.stat.islnk
          - dotfiles_nested_stat.stat.lnk_target == _container_fixture_root ~ '/common/.config/test/conf.toml'

    - name: .config must be a real directory (not a symlink), so per-file symlinks compose
      ansible.builtin.stat:
        path: "{{ _test_home }}/.config"
        follow: false
      register: dotfiles_config_dir_stat

    - name: Assert .config is a real directory
      ansible.builtin.assert:
        that:
          - dotfiles_config_dir_stat.stat.isdir
          - not dotfiles_config_dir_stat.stat.islnk
