---
# homebrew role
# Run `brew bundle` over the layered Brewfiles
# (common_brewfile + (group_<set>_brewfile for set in group_sets) + host_brewfile).
# See group_vars/all.yml for the package-layering convention (including
# the `lookup('vars', ...)`-based indirection over `group_sets`).
# Runs on both macOS and Linux (Linuxbrew). Anything macOS-only
# (formulae, casks, etc.) lives in the `os`-set's macos Brewfile
# layer (`brewfiles/groups/macos.Brewfile`), so the common layer
# stays genuinely cross-platform.

- name: Resolve homebrew group-set Brewfile paths
  # Loop set_fact (rather than a one-liner using `vars` as a dict, which
  # ansible-core deprecated). lookup('vars', name) without a default
  # raises on a missing name, so a typo in `group_sets` or a group_vars
  # file that doesn't declare its `group_<set>_brewfile` layer fails
  # loudly here. Empty-string paths (linux.yml's default for no
  # OS-layer Brewfile) get filtered out by the stat step's `when`.
  ansible.builtin.set_fact:
    homebrew_group_brewfile_layer: >-
      {{ (homebrew_group_brewfile_layer | default([]))
         + [lookup('vars', 'group_' ~ item ~ '_brewfile')] }}
  loop: "{{ group_sets }}"
  loop_control:
    label: "group_{{ item }}_brewfile"

- name: Stat each Brewfile layer
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: >-
    {{ [common_brewfile | default('')]
       + homebrew_group_brewfile_layer
       + [host_brewfile | default('')] }}
  register: homebrew_brewfile_stats
  when: item | length > 0
  loop_control:
    label: "{{ item }}"

- name: Collect the Brewfile layers that exist on disk
  # Flattens the stat results into a plain list of paths so the loops
  # below don't have to chase nested attributes through a registered
  # loop result. Layers whose variable was empty (the stat above
  # skipped them via `when`) have no `stat` key, hence the first
  # selectattr; layers whose path doesn't exist on disk are filtered
  # by the second.
  ansible.builtin.set_fact:
    homebrew_present_brewfiles: >-
      {{ homebrew_brewfile_stats.results
         | selectattr('stat', 'defined')
         | selectattr('stat.exists')
         | map(attribute='stat.path')
         | list }}

# `brew bundle check` exits 0 when every entry in the file is already
# satisfied, non-zero otherwise. It's much cheaper than `brew bundle
# install` because it skips the per-formula network probe — so use it as
# an idempotency gate and only run the install when something drifted.
- name: Check whether each Brewfile layer is already satisfied
  ansible.builtin.command:
    argv:
      - brew
      - bundle
      - check
      - --file
      - "{{ item }}"
  loop: "{{ homebrew_present_brewfiles }}"
  register: homebrew_bundle_checks
  changed_when: false
  failed_when: false
  check_mode: false

- name: Run brew bundle install for layers that drifted
  ansible.builtin.command:
    argv:
      - brew
      - bundle
      - install
      - --file
      - "{{ item.item }}"
  loop: "{{ homebrew_bundle_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  register: homebrew_bundle_result
  changed_when: >-
    ('Installing' in (homebrew_bundle_result.stdout | default('')))
    or ('Upgrading' in (homebrew_bundle_result.stdout | default('')))

# Upgrade pass — runs once after all per-layer bundle installs.
# Controlled by homebrew_upgrade_outdated (default true in
# roles/homebrew/defaults/main.yml); pass `--no-upgrade` to install.sh /
# phase2.py for a per-run opt-out (sets the var to false via `-e`).
# `brew outdated` is cheap and is gated first so the `brew upgrade` task
# only reports CHANGED when there was actually something to upgrade.
- name: Find outdated Homebrew packages
  ansible.builtin.command:
    argv:
      - brew
      - outdated
  register: homebrew_outdated
  changed_when: false
  check_mode: false
  when: homebrew_upgrade_outdated

- name: Upgrade outdated Homebrew packages
  ansible.builtin.command:
    argv:
      - brew
      - upgrade
  when:
    - homebrew_upgrade_outdated
    - homebrew_outdated.stdout | default('') | length > 0
  changed_when: true
