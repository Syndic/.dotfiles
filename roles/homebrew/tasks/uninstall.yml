---
# homebrew role — uninstall path. Inverse of main.yml.
#
# `brew bundle` has no built-in "uninstall everything listed in this Brewfile"
# command (`brew bundle cleanup` removes what's NOT listed, the opposite of
# what we want). So we extract the package names from each layer ourselves
# and shell out to `brew uninstall`. Casks count too; taps are left in place
# because removing a tap doesn't uninstall its packages and the user may have
# other installs depending on it.

- name: Resolve homebrew group-set Brewfile paths
  ansible.builtin.set_fact:
    homebrew_group_brewfile_layer: >-
      {{ (homebrew_group_brewfile_layer | default([]))
         + [lookup('vars', 'group_' ~ item ~ '_brewfile')] }}
  loop: "{{ group_sets }}"
  loop_control:
    label: "group_{{ item }}_brewfile"

- name: Stat each Brewfile layer
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: >-
    {{ [common_brewfile | default('')]
       + homebrew_group_brewfile_layer
       + [host_brewfile | default('')] }}
  register: homebrew_uninstall_brewfile_stats
  when: item | length > 0
  loop_control:
    label: "{{ item }}"

- name: Uninstall packages listed in each existing Brewfile layer
  # `awk` pulls the quoted name from every `brew "X"` and `cask "X"` line;
  # xargs feeds them to `brew uninstall` one batch. `|| true` keeps the
  # task from failing for packages already absent — uninstall is idempotent.
  ansible.builtin.shell: |
    set -euo pipefail
    names=$(awk -F'"' '/^[[:space:]]*(brew|cask)[[:space:]]+"/ {print $2}' {{ brewfile_layer.item | quote }})
    if [ -n "$names" ]; then
      echo "$names" | xargs brew uninstall --ignore-dependencies || true
    fi
  loop: "{{ homebrew_uninstall_brewfile_stats.results | default([]) }}"
  loop_control:
    loop_var: brewfile_layer
    label: "{{ brewfile_layer.item }}"
  when:
    - not (brewfile_layer.skipped | default(false))
    - brewfile_layer.stat.exists | default(false)
  register: homebrew_uninstall_result
  # `brew uninstall` prints "Uninstalling /opt/homebrew/Cellar/<name>/..." to
  # stdout when it actually removes something, and only an "Error: No such
  # keg" (swallowed by `|| true`) when the package is already gone. Mirrors
  # the install side, which keys off "Installing"/"Upgrading" in stdout.
  changed_when: "'Uninstalling' in (homebrew_uninstall_result.stdout | default(''))"
