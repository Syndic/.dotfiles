---
# Converge — homebrew role, gate verification.
#
# Two plays against the same container. The image pre-installs `hello`,
# so a Brewfile of `brew "hello"` starts in the satisfied state — that's
# what exercises the install gate. The upgrade gate has two paths, tested
# as the two plays: var=true → the outdated check runs; var=false → it's
# gated off entirely.
#
# The plays assert on the role's internal task results (homebrew_bundle_result,
# homebrew_outdated): distinguishing "task ran and did nothing" from "task
# was gated off entirely" is the install-gate regression-cover for ae021b2,
# and only the `register:` introspection can tell those apart. Whether
# `brew outdated` actually reports a formula is live upstream package state,
# not the gate's behavior — so the true-path play asserts only that the
# check *ran*, never that it found nothing (that coupling to upstream is
# what let a stale base image turn this scenario red).

- name: Converge — homebrew role (gates, upgrade=true)
  hosts: all
  gather_facts: true
  vars:
    group_sets: []
    common_brewfile: /tmp/molecule-homebrew/common.Brewfile
    # Default for homebrew_upgrade_outdated is true; left implicit so
    # this play also exercises that default.
  pre_tasks:
    - name: Ensure fixture dir exists
      ansible.builtin.file:
        path: /tmp/molecule-homebrew
        state: directory
        mode: '0755'

    - name: Write common Brewfile (image pre-installs this formula)
      ansible.builtin.copy:
        content: |
          brew "hello"
        dest: "{{ common_brewfile }}"
        mode: '0644'
  roles:
    - role: homebrew
  post_tasks:
    - name: Install task must skip every layer (brew bundle check passed)
      ansible.builtin.assert:
        that:
          - homebrew_bundle_result.results
            | selectattr('skipped', 'undefined') | list | length == 0
        fail_msg: >-
          Expected every install entry skipped; got
          {{ homebrew_bundle_result.results }}

    - name: Outdated check must have run (homebrew_upgrade_outdated=true)
      ansible.builtin.assert:
        that:
          - homebrew_outdated is defined
          - homebrew_outdated.skipped | default(false) is false
        fail_msg: >-
          Expected the outdated check to run (not be gated off); got
          {{ homebrew_outdated | default('<undefined>') }}

- name: Converge — homebrew role (gates, upgrade=false)
  hosts: all
  gather_facts: false
  vars:
    group_sets: []
    common_brewfile: /tmp/molecule-homebrew/common.Brewfile
    homebrew_upgrade_outdated: false
  roles:
    - role: homebrew
  post_tasks:
    - name: Install task must still skip every layer
      ansible.builtin.assert:
        that:
          - homebrew_bundle_result.results
            | selectattr('skipped', 'undefined') | list | length == 0
        fail_msg: >-
          Expected every install entry skipped; got
          {{ homebrew_bundle_result.results }}

    - name: Outdated check itself must skip (homebrew_upgrade_outdated=false)
      ansible.builtin.assert:
        that:
          - homebrew_outdated.skipped | default(false) is true
        fail_msg: >-
          Expected outdated check to skip; got
          {{ homebrew_outdated | default('<undefined>') }}
