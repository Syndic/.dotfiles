---
- name: Verify — homebrew role (multi-layer)
  hosts: all
  gather_facts: false
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  tasks:
    - name: Query brew for one formula per layer
      ansible.builtin.command:
        cmd: "brew list --formula --versions {{ item }}"
      register: homebrew_multi_results
      changed_when: false
      failed_when: false
      loop:
        - jo       # common_brewfile
        - pwgen    # group_purpose_brewfile
        - tree     # group_os_brewfile
        - entr     # host_brewfile

    - name: Each layer's formula must be installed
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout is search('^' ~ item.item ~ ' ')
        fail_msg: >-
          {{ item.item }} not installed
          (rc={{ item.rc }}, stdout={{ item.stdout }})
      loop: "{{ homebrew_multi_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read Homebrew's trust store
      ansible.builtin.command:
        cmd: brew trust --json=v1
      register: homebrew_trust_store
      changed_when: false

    - name: The Brewfile's `trusted:` option must have trusted the fixture tap
      ansible.builtin.assert:
        that:
          - "'dotfiles/fixtures' in (homebrew_trust_store.stdout | from_json).taps"
        fail_msg: "dotfiles/fixtures not trusted: {{ homebrew_trust_store.stdout }}"

    - name: Run the common layer's fixture formula binary
      ansible.builtin.command:
        cmd: molecule-fixture-formula
      register: homebrew_fixture_formula_run
      changed_when: false
      failed_when: false

    - name: The fixture formula from the trusted tap must be installed and linked
      ansible.builtin.assert:
        that:
          - homebrew_fixture_formula_run.rc == 0
          - homebrew_fixture_formula_run.stdout == 'molecule fixture cask'
        fail_msg: >-
          molecule-fixture-formula not runnable
          (rc={{ homebrew_fixture_formula_run.rc }}, stderr={{ homebrew_fixture_formula_run.stderr }})

    - name: Run the common layer's fixture cask binary
      ansible.builtin.command:
        cmd: molecule-fixture
      register: homebrew_fixture_run
      changed_when: false
      failed_when: false

    - name: The fixture cask must be installed and linked
      ansible.builtin.assert:
        that:
          - homebrew_fixture_run.rc == 0
          - homebrew_fixture_run.stdout == 'molecule fixture cask'
        fail_msg: >-
          molecule-fixture cask not runnable
          (rc={{ homebrew_fixture_run.rc }}, stderr={{ homebrew_fixture_run.stderr }})
