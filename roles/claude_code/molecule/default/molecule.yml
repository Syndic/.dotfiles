---
# molecule scenario for the claude_code role. prepare.yml stages the repo's
# real marketplace manifest into the container (no bind mount; see the
# dotfiles scenario's molecule.yml for why) and seeds a settings.json the
# role doesn't own.

driver:
  name: docker

platforms:
  - name: claude-code-instance
    # renovate: datasource=docker depName=geerlingguy/docker-debian12-ansible
    image: geerlingguy/docker-debian12-ansible:latest@sha256:74c7e3326b2a35aa4f32c2e943e48a03da8698e2d0c484153bb24110387b285d
    pre_build_image: true
    # The role only writes a JSON file: no systemd, no privileges.
    command: sleep infinity

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      # Molecule doesn't read the root ansible.cfg; see CLAUDE.md "Lint".
      callback_result_format: yaml

verifier:
  name: ansible
