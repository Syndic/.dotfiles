---
# molecule scenario for the claude_code role. prepare.yml stages the repo's
# real marketplace manifest into the container (no bind mount; see the
# dotfiles scenario's molecule.yml for why) and seeds a settings.json the
# role doesn't own.

driver:
  name: docker

platforms:
  - name: claude-code-instance
    # renovate: datasource=docker depName=geerlingguy/docker-debian12-ansible
    image: geerlingguy/docker-debian12-ansible:latest@sha256:e365f7f43a95b8bd31b4ed25da1a4e3a5ae576151c4df67cf51776e696644e4e
    pre_build_image: true
    # The role only writes a JSON file: no systemd, no privileges.
    command: sleep infinity

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      callback_result_format: yaml

verifier:
  name: ansible
