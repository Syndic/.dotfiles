---
# Main dotfiles playbook.
# Run with: ansible-playbook site.yml -i inventory.yml --limit <hostname>
# Run only certs: ansible-playbook site.yml -i inventory.yml --limit <hostname> --tags certs

- name: Configure dotfiles
  hosts: all
  connection: local
  # gather_facts: true so OS-gated roles below can key off
  # ansible_facts['system'] / ansible_facts['os_family']. Cheap on
  # connection: local.
  gather_facts: true

  roles:
    - homebrew
    - role: apt
      when: ansible_facts['os_family'] == 'Debian'
    - role: flatpak
      when: ansible_facts['system'] == 'Linux'
    - dotfiles
    - role: macos_defaults
      when: ansible_facts['system'] == 'Darwin'
    - role: certs
      tags: certs
    - role: ssh
      tags: ssh
