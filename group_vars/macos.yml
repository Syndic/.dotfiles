---
# Shared variables for all macOS machines (group `macos` in the `os`
# group set — see inventory.yml).
# Everything gets group_vars/all.yml.
# Cross-group-set values (purpose × os) compose; per-host overrides go
# in host_vars/<hostname>.yml.
#
# Defines every `group_os_<thing>` var that a role running on a macOS
# host might consume. The indirection in each role uses the Jinja
# `extract` filter over `group_sets`, which raises if a referenced var
# is missing — keeping that strictness lets typos in `group_sets` (or
# in a layered-var name on a role) fail loudly instead of silently
# returning empty. Cost: a handful of empty-list declarations here.
# Roles that don't run on macOS (apt, flatpak) don't read these from
# this file, so we don't have to define their layered vars here.

# Brewfile layer for the macos group. Anything macOS-only goes here:
# casks, macOS-only formulae, packages you only want on Macs.
group_os_brewfile: "{{ playbook_dir }}/brewfiles/groups/macos.Brewfile"

# macOS-system-preference layers, consumed by roles/macos_defaults.
# Empty by default — populate when you have settings every Mac in your
# fleet should share. Per-host customization goes in host_vars/<host>.yml.
group_os_macos_defaults: []
group_os_dockitems_persist: []
group_os_dockitems_remove: []
