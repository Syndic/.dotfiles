---
# Shared variables for _all_ machines.
# Group-specific overrides go in group_vars/<group>.yml.
# Host-specific overrides go in host_vars/<hostname>.yml.

# Run modules under the same interpreter that launched Ansible so local
# interpreter discovery doesn't drift as other Python installs appear.
ansible_python_interpreter: "{{ ansible_playbook_python }}"

# -----------------------------------------------------------------------------
# Package layering convention
#
# For each package backend (brewfile, apt, flatpak), values come from up to
# three scopes that the role concatenates at run time:
#
#   common_<thing>              applied to all hosts; lives in this file
#   group_<set>_<thing>         applied per group within a group set;
#                               lives in group_vars/<group>.yml for each
#                               group in that set
#   host_<thing>                applied to one host; lives in host_vars/<h>.yml
#
# Scope is encoded as a *prefix* (common_, group_<set>_, host_) so all vars
# at the same scope sort together alphabetically. The `group_<set>_<thing>`
# form additionally names the set, so values from different sets compose
# rather than collide if we ever add a second set (e.g. an OS axis). See
# inventory.yml for the list of currently defined sets.
# -----------------------------------------------------------------------------

# Brewfile (used on both macOS and Linux — Linuxbrew silently skips casks).
common_brewfile: "{{ playbook_dir }}/brewfiles/common.Brewfile"

# apt packages (Linux only; the apt role is gated to Debian in site.yml, so
# these lists are simply unused on macOS hosts).
common_apt: []

# flatpak apps (Linux only; the flatpak role is gated to Linux in site.yml).
common_flatpak: []

# -----------------------------------------------------------------------------
# Role-level toggles
# -----------------------------------------------------------------------------

# When true, the homebrew role runs `brew upgrade` once after all
# per-layer `brew bundle install` passes so already-installed packages
# move to their latest versions. Default true. Override per run by
# passing `--no-upgrade` to `install.sh` / `phase2.py`, which sets
# `-e homebrew_upgrade_outdated=false` on the ansible-playbook
# invocation. The role's own default lives in
# roles/homebrew/defaults/main.yml.
homebrew_upgrade_outdated: true
