---
# Shared variables for _all_ machines.
# Group-specific overrides go in group_vars/<group>.yml.
# Host-specific overrides go in host_vars/<hostname>.yml.

# Run modules under the same interpreter that launched Ansible so local
# interpreter discovery doesn't drift as other Python installs appear.
ansible_python_interpreter: "{{ ansible_playbook_python }}"

# -----------------------------------------------------------------------------
# Package & settings layering convention
#
# For each package backend (brewfile, apt, flatpak), for the macOS
# settings inputs (macos_defaults, dockitems_persist, dockitems_remove),
# and for the dotfiles overlay roots (dotfiles), values come from three
# scopes that the role concatenates at run time:
#
#   common_<thing>              applied to all hosts; lives in this file
#   group_<set>_<thing>         applied per group within a group set;
#                               lives in group_vars/<group>.yml for each
#                               group in that set, one var per set
#   host_<thing>                applied to one host; lives in host_vars/<h>.yml
#
# Scope is encoded as a *prefix* (common_, group_<set>_, host_) so all vars
# at the same scope sort together alphabetically. The `group_<set>_<thing>`
# form additionally names the set, so values from different sets compose
# rather than collide. See inventory.yml for the list of currently defined
# sets.
#
# The group-set list is declared once here as `group_sets`. Roles iterate
# it via a per-set `set_fact` loop using `lookup('vars', ...)`, so adding
# a new set is a one-line edit here (plus the per-group_vars files for
# the new groups) — no per-role edits. The standard role-side pattern is:
#
#   - name: Initialize <role>_group_layer
#     ansible.builtin.set_fact:
#       <role>_group_layer: []
#
#   - name: Resolve <thing> group-set layers
#     ansible.builtin.set_fact:
#       <role>_group_layer: >-
#         {{ <role>_group_layer
#            + lookup('vars', 'group_' ~ item ~ '_<thing>') }}
#     loop: "{{ group_sets }}"
#
# The separate init task guarantees the var is defined even when
# `group_sets` is empty (the resolve loop runs zero times in that case),
# so consumers downstream don't need their own `| default([])`.
#
# `lookup('vars', name)` without a default raises on a missing name —
# that's what makes typos in `group_sets` or in a `<thing>` name in a
# role fail loudly. The corollary is that every group_vars/<group>.yml
# has to define every layered var that any role running on hosts in
# that group might consume (use `[]` or `""` for layers that the group
# doesn't actually contribute to). See group_vars/macos.yml and
# group_vars/linux.yml for examples.
# -----------------------------------------------------------------------------

# Ordered list of active group sets. Order determines concatenation order in
# the layered vars (purpose contribution comes before os contribution, etc.).
# Visual-only for list-typed layers; affects install order for the Brewfile
# layer. Adding a new set: append it here, define the groups in inventory.yml,
# create group_vars/<group>.yml for each new group with all relevant
# `group_<newset>_<thing>` vars declared.
group_sets:
  - purpose
  - os

# Cross-platform Brewfile layer — entries here apply to every host
# (macOS and Linux). Anything macOS-only belongs in the `os`-set's
# macos layer (`brewfiles/groups/macos.Brewfile`), not here.
common_brewfile: "{{ playbook_dir }}/brewfiles/common.Brewfile"

# Cross-platform dotfiles overlay — files here are symlinked into $HOME on
# every host. Per-set group overlays go under home_source/groups/<group>/;
# per-host overlays under home_source/hosts/<host>/.
common_dotfiles: "{{ playbook_dir }}/home_source/common"

# apt packages (Linux only; the apt role is gated to Debian in site.yml, so
# these lists are simply unused on macOS hosts).
common_apt: []

# flatpak apps (Linux only; the flatpak role is gated to Linux in site.yml).
common_flatpak: []

# macOS defaults (Darwin only; the macos_defaults role is gated to Darwin
# in site.yml, so these lists are simply unused on Linux hosts). Each
# entry is a dict accepted by community.general.osx_defaults:
#   - { domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool, value: true }
# `domain` defaults to NSGlobalDomain, `type` to 'string', `state` to
# 'present' if omitted. See roles/macos_defaults/tasks/main.yml.
common_macos_defaults: []

# macOS Dock items (Darwin only; consumed by geerlingguy.mac.dock and
# gated by `macos_defaults_configure_dock: true` per host). `dockitems_persist` entries
# are dicts ({name, path, pos}); `dockitems_remove` entries are plain
# strings (e.g. "Launchpad", "TV"). Unused on Linux hosts.
common_dockitems_persist: []
common_dockitems_remove: []
