---
# Shared variables for all personal machines (group `personal` in the
# `purpose` group set — see inventory.yml).
# Everything gets group_vars/all.yml.
# Host-specific overrides go in host_vars/<hostname>.yml.

# Brewfile layer shared by all personal machines (used on both macOS and Linux).
group_purpose_brewfile: "{{ playbook_dir }}/brewfiles/groups/personal.Brewfile"

# apt / flatpak layers shared by all personal Linux machines. Unused on
# macOS personal hosts (the apt/flatpak roles are gated to Linux in site.yml).
group_purpose_apt: []
group_purpose_flatpak: []

# macOS defaults / Dock layers shared by all personal macOS machines.
# Unused on Linux personal hosts (the macos_defaults role is gated to
# Darwin in site.yml). See group_vars/all.yml for entry shape.
group_purpose_macos_defaults: []
group_purpose_dockitems_persist: []
group_purpose_dockitems_remove: []
