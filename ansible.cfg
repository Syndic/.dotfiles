# Pins shared by ansible / ansible-playbook / ansible-lint runs in this repo.
# Who reads this file (and molecule, which doesn't): CLAUDE.md "Lint".
#
# The user-installed Galaxy collection cache (~/.ansible/collections) is the
# default and is intentionally not overridden — phase2.install_galaxy_requirements
# and the devcontainer's post-create.sh both install there.

[defaults]
inventory = inventory.yml
roles_path = roles
nocows = True
# YAML-formatted task results; a bare `yaml` callback names the removed
# community.general.yaml plugin.
stdout_callback = default
callback_result_format = yaml
# Keep deprecation noise visible — we lint against it in CI.
deprecation_warnings = True
