# Pins shared by every invocation of ansible / ansible-playbook / ansible-lint
# in this repo — devcontainer, CI, and bare-host runs alike. Without these,
# ansible-lint and ad-hoc `ansible-playbook` calls would each have to be told
# where roles / collections / inventory live, and would drift apart.
#
# The user-installed Galaxy collection cache (~/.ansible/collections) is the
# default and is intentionally not overridden — phase2.install_galaxy_requirements
# and the devcontainer's post-create.sh both install there.

[defaults]
inventory = inventory.yml
roles_path = roles
nocows = True
# Cleaner per-task output than the default callback when run interactively.
stdout_callback = yaml
# Keep deprecation noise visible — we lint against it in CI.
deprecation_warnings = True
