---
repos:
  - repo: local
    hooks:
      - id: dotfiles-source-guard
        name: reject nested .dotfiles dirs and symlinks in home_source
        entry: python3 dotfiles_manager.py check home_source
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # ansible-lint config in .ansible-lint; collections picked up from
  # ~/.ansible/collections (post-create.sh / phase2.py installs them).
  # `files:` gates on Ansible inputs; `pass_filenames: false` keeps the
  # actual run whole-repo so cross-file findings still surface.
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        pass_filenames: false
        # (?x) = verbose regex; wraps under yamllint's 120-char limit.
        # Root-level .yml/.yaml without a leading dot catches new top-level
        # playbooks automatically; excludes `.pre-commit-config.yaml` etc.
        files: |
          (?x)^(
            roles/ |
            group_vars/ |
            host_vars/ |
            playbooks/ |
            ansible\.cfg |
            \.ansible-lint |
            [^./][^/]*\.ya?ml$
          )
